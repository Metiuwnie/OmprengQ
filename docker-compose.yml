services:
  mysql:
    image: mysql:8.4
    container_name: omprengq-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: omprengq
      MYSQL_USER: omprengq
      MYSQL_PASSWORD: omprengq
      MYSQL_ROOT_PASSWORD: omprengq_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uomprengq", "-pomprengq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
